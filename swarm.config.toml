# Generated by stampede setup; role choices are project-local.

[swarm]
name = "stampede"
workspace_label = "swarm-dev"
trace_dir = ".herdr-swarm/traces"
worktree_root = ".herdr-swarm/worktrees"
version = "1.0.0"
log_path = "/tmp/herdr-process.log"

[attention]
mode = "quiet"
bounded_looper = true

[fanout]
gate_concurrency = 2
max_workers = 2

[reviewer]
loop = true
max_rounds = 2
failover_seat = "arch_1"

[headless]
max_verdict_attempts = 2
worker_timeout_s = 600

[proxy]
enabled = false
endpoint = "http://localhost:4114/v1"
model_override = "auto"
health_check_url = "http://localhost:4114/openapi.json"
serve_cmd = ""
credentials = ""

[geometry]
min_cols = 80
min_rows = 20
enforce_floor = true
auto_relocate_cramped = true

[seats.looper]
name = "looper"
role = "Autonomous Loop Orchestrator"
default_kind = "agy"
model = "gemini-3.8-flash-high"
brief = "briefs/looper.md"
tab = "herd"
position = "bottom-full"
cost_tier = "medium"

[seats.pm]
name = "pm"
role = "Product Manager & Overseer"
default_kind = "claude"
model = "claude-5-5-sonnet"
brief = "briefs/overseer-pm.md"
tab = "herd"
position = "top-left"
critical = true
cost_tier = "medium"

[seats.gh]
name = "agy-gh"
role = "GitHub & CI Operations"
default_kind = "agy"
model = "gemini-3.8-flash-low"
brief = "briefs/worker-gh.md"
tab = "ops"
position = "top-right"
cost_tier = "low"

[seats.docs]
name = "agy-docs"
role = "Documentation & Architecture Records (ADRs)"
default_kind = "agy"
model = "gemini-3.8-flash-low"
brief = "briefs/worker-docs.md"
tab = "ops"
position = "top-left"
cost_tier = "low"

[seats.arch_1]
name = "arch-1"
role = "Implementation Engine (GLM-5.3)"
kinds = ["opencode", "claude"]
model = "zai-coding-plan/glm-5.3"
brief = "briefs/arch.md"
tab = "herd"
position = "top-right"
worktree = true
critical = true

[seats.arch_2]
name = "arch-2"
role = "Implementation Engine (GLM-5.3)"
kinds = ["opencode", "claude"]
model = "zai-coding-plan/glm-5.3"
brief = "briefs/arch.md"
tab = "herd"
position = "bottom-right"
worktree = true
critical = true

[seats.helper]
name = "helper"
role = "helper"
default_kind = "agy"
model = "gemini-3.8-flash-medium"
cost_tier = "medium"
brief = "briefs/helper.md"
tab = "ops"
worktree = true

[seats.pi]
name = "pi"
role = "Local Fast Implementation Engine (optional)"
default_kind = "pi"
model = "auto"
brief = "briefs/pi.md"
tab = "herd"
position = "bottom-left"
worktree = true
enabled = false

[seats.looper_standby]
name = "looper-standby"
role = "Standby Orchestrator (quota-triggered takeover, FALLBACK-1)"
default_kind = "opencode"
model = "zai-coding-plan/glm-5.3-flash"
brief = "briefs/looper-standby.in.md"
tab = "herd"
position = "bottom-full"
enabled = false

[seats.reviewer]
name = "reviewer"
role = "Security & Quality Auditor (Optional)"
default_kind = "agy"
model = "gemini-2.5-flash"
brief = "briefs/reviewer.md"
tab = "ops"
position = "optional"
enabled = true
