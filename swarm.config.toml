# Swarm Configuration: Herdr + AGY + Claude + OpenCode (GLM-5.3) + Kultivait
# Location: ~/Fun/stampede/swarm.config.toml
#
# New here? `stampede init` generates this file from the providers actually
# installed on your machine (preset + provider chain, fail-closed when
# nothing is usable). Hand edits remain first-class; regeneration needs
# --force and keeps a .bak (PUB-7).

[swarm]
name = "stampede"
version = "1.0.0"
workspace_label = "swarm-dev"
log_path = "/tmp/herdr-process.log"
trace_dir = ".herdr-swarm/traces"
worktree_root = ".herdr-swarm/worktrees"

[fanout]
# Phase 3 concurrency controls (ADR 0013)
gate_concurrency = 2      # concurrent suite gates (0 = legacy inline gating)
max_workers = 2           # back-pressure comparison point

[reviewer]
# Autonomous review loop (REV-1). loop = false keeps the reviewer advisory
# (terminal anchor REVIEW DONE, nothing harvested). loop = true runs
# verdict-anchored rounds: durable findings land in
# .herdr-swarm/reviews/<ticket>-<sha>.md and the terminal anchor becomes
# REVIEW VERDICT #<ticket> <sha> <PASS|BLOCK>. max_rounds bounds re-review
# rounds per (ticket, sha).
loop = true
max_rounds = 2

[proxy]
# Off by default: a universal target repo must not inherit this machine's
# kultivait setup. Flip to true (and set serve_cmd) to route seats through
# the local proxy.
enabled = false
endpoint = "http://localhost:4114/v1"
model_override = "auto"
health_check_url = "http://localhost:4114/openapi.json"
# No serve command ships: a fresh clone must not launch a proxy it never
# configured. On a kultivait machine set this to "uv run kultivait serve".
serve_cmd = ""
# Same policy for the OpenRouter credentials file read by the supervisor's
# credit probe (PROXY_CREDENTIALS). No default path. On a kultivait machine
# set it to "~/.kultivait/credentials.toml".
credentials = ""

[geometry]
min_cols = 80
min_rows = 20
enforce_floor = true
auto_relocate_cramped = true

# Agent Seats Definition
[seats.pm]
name = "pm"
role = "Product Manager & Overseer"
default_kind = "claude"
model = "claude-3-7-sonnet"
brief = "briefs/overseer-pm.md"
tab = "herd"
position = "top-left"

[seats.arch_1]
name = "arch-1"
role = "Implementation Engine (GLM-5.3)"
# Fallback chain (PUB-6): primary opencode, claude when opencode is
# absent/unhealthy. kinds[0] is the primary; default_kind is the
# single-element sugar.
kinds = ["opencode", "claude"]
model = "zai/glm-5.3"
brief = "briefs/arch.md"
tab = "herd"
position = "top-right"
worktree = true

[seats.arch_2]
name = "arch-2"
role = "Implementation Engine (GLM-5.3)"
kinds = ["opencode", "claude"]
model = "zai/glm-5.3"
brief = "briefs/arch.md"
tab = "herd"
position = "bottom-right"
worktree = true

# Optional local engine, disabled by default (DOG-7): a fresh clone has no
# pi/kultivait runtime, and `herdr agent start --kind pi` would fail to seat.
# To enable on a machine that runs the local proxy: flip enabled, set model
# back to "kultivait/auto", and author briefs/pi.md (git history keeps the
# kultivait-era template).
[seats.pi]
name = "pi"
role = "Local Fast Implementation Engine (optional)"
default_kind = "pi"
model = "auto"
brief = "briefs/pi.md"
tab = "herd"
position = "bottom-left"
worktree = true
enabled = false

[seats.looper]
name = "looper"
role = "Autonomous Loop Orchestrator"
default_kind = "agy"
model = "gemini-2.5-pro"
brief = "briefs/looper.md"
tab = "herd"
position = "bottom-full"

[seats.docs]
name = "agy-docs"
role = "Documentation & Architecture Records (ADRs)"
default_kind = "agy"
model = "gemini-2.5-flash"
brief = "briefs/worker-docs.md"
tab = "ops"
position = "top-left"

[seats.gh]
name = "agy-gh"
role = "GitHub & CI Operations"
default_kind = "agy"
model = "gemini-2.5-flash"
brief = "briefs/worker-gh.md"
tab = "ops"
position = "top-right"

[seats.reviewer]
name = "reviewer"
role = "Security & Quality Auditor (Optional)"
default_kind = "agy"
model = "gemini-2.5-flash"
brief = "briefs/reviewer.md"
tab = "ops"
position = "optional"
enabled = true
